<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小兔米米的勇氣種子｜動畫故事</title><style>
:root{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#493c46}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff4dc,#e2f8ed);min-height:100vh}.wrap{max-width:950px;margin:auto;padding:16px}header{text-align:center}h1{font-size:clamp(25px,4vw,39px);margin:12px 0 3px;color:#a65079}header p{margin:4px 0 16px}.stage{position:relative;overflow:hidden;border:6px solid white;border-radius:26px;height:min(56vw,470px);min-height:290px;background:linear-gradient(#bdeeff 0 67%,#a9d988 67%);box-shadow:0 12px 35px #6a8b7040}.sun{position:absolute;top:7%;right:9%;font-size:65px;animation:glow 3s infinite alternate}.cloud{position:absolute;top:15%;left:9%;font-size:55px;animation:float 8s infinite alternate}.hill{position:absolute;bottom:-12%;width:75%;height:45%;border-radius:50%;background:#83c57e}.hill.left{left:-24%}.hill.right{right:-28%;background:#74b96e}.bunny,.mom,.squirrel,.pot,.flower,.rain,.message{position:absolute;transition:opacity .6s,transform .8s}.bunny{left:12%;bottom:16%;font-size:clamp(85px,14vw,145px);animation:bob 1.9s infinite}.mom{right:7%;bottom:17%;font-size:clamp(85px,14vw,145px);animation:bob 2.5s infinite}.squirrel{right:15%;bottom:18%;font-size:clamp(65px,10vw,105px);animation:bob 1.5s infinite}.pot{left:48%;bottom:12%;font-size:clamp(75px,12vw,120px)}.flower{left:50%;bottom:32%;font-size:clamp(55px,9vw,90px);transform-origin:bottom;animation:sway 3s infinite}.rain{inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 35px,#d4f2ffb8 37px 40px,transparent 42px 75px);animation:rain .5s linear infinite}.message{left:50%;top:6%;transform:translateX(-50%);font-size:clamp(19px,3.5vw,30px);font-weight:900;color:#965175;background:#ffffffde;padding:9px 22px;border-radius:30px;white-space:nowrap}.hidden{opacity:0!important;pointer-events:none}.panel{background:#fff;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 5px 20px #768d7930}.narration{font-size:clamp(19px,2.8vw,25px);line-height:1.75;min-height:90px;text-align:center;font-weight:700}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-items:center}button,select{font:inherit;border:0;border-radius:14px;padding:11px 17px;background:#ef83a3;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#65aa9b}button:disabled{opacity:.4;cursor:default}select{background:#fff;color:#554b57;border:2px solid #a9d6c3}.progress{height:10px;border-radius:12px;background:#e9e9e9;margin:12px 0;overflow:hidden}.bar{height:100%;width:0;background:#f29d50;transition:width .3s}.note{text-align:center;color:#6b6470;font-size:14px}.sceneNum{text-align:center;color:#8a7280;font-weight:700}.stars{position:absolute;bottom:10%;left:5%;font-size:38px;opacity:.7}@keyframes bob{50%{transform:translateY(-12px)}}@keyframes sway{50%{transform:rotate(9deg)}}@keyframes glow{to{transform:scale(1.12)}}@keyframes float{to{transform:translateX(75px)}}@keyframes rain{to{background-position:0 80px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><header><h1>🌈 小兔米米的勇氣種子</h1><p>2–5歲幼兒｜互動動畫繪本｜粵語朗讀</p></header><div class="stage" aria-label="故事動畫場景"><div class="sun" id="sun">☀️</div><div class="cloud">☁️</div><div class="hill left"></div><div class="hill right"></div><div class="stars">🌼 🌸 🌼</div><div class="message" id="bubble">我肯試！</div><div class="bunny" id="bunny">🐰</div><div class="mom" id="mom">🐇</div><div class="squirrel" id="squirrel">🐿️</div><div class="pot" id="pot">🪴</div><div class="flower" id="flower">🌻</div><div class="rain hidden" id="rain"></div></div><section class="panel"><div class="sceneNum" id="sceneNum">第1幕／共6幕</div><div class="narration" id="narration" aria-live="polite"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="controls"><button id="play">▶ 播放故事</button><button class="secondary" id="prev">◀ 上一幕</button><button class="secondary" id="next">下一幕 ▶</button><button class="secondary" id="repeat">🔊 重讀這一幕</button><label>語速 <select id="rate"><option value="0.75">慢</option><option value="0.9" selected>正常</option><option value="1.05">稍快</option></select></label></div><p class="note" id="voiceNote">請點擊「播放故事」啟動聲音。粵語語音需裝置或瀏覽器支援 zh-HK 語音。</p></section></main><script>
const scenes=[
{txt:'森林裏住着一隻小白兔，叫米米。有一天，兔媽媽送給米米一粒小種子。米米好開心，話：「我要種出一朵靚靚嘅花！」',bubble:'我要種花！',mom:1,squirrel:0,plant:'🪴',flower:0,rain:0,duration:19000},
{txt:'米米把種子種入泥土，輕輕淋水。第二日，未發芽。第三日，都未發芽。米米有啲唔開心：「我係咪做唔到呀？」',bubble:'我做唔到？',mom:0,squirrel:0,plant:'🪴',flower:0,rain:0,duration:18000},
{txt:'小松鼠跳過嚟，話：「米米，唔好灰心！種子需要時間長大。我哋一齊試吓！」米米點點頭：「好！我再試一次！」',bubble:'再試一次！',mom:0,squirrel:1,plant:'🪴',flower:0,rain:0,duration:19000},
{txt:'米米每日都用心照顧種子。一天、兩天、三天……嘩！泥土裏終於冒出一片綠色小葉！米米開心到跳起！',bubble:'發芽啦！',mom:0,squirrel:1,plant:'🌱',flower:0,rain:0,duration:17000},
{txt:'突然落起大雨，小花苗被風吹到東歪西倒。米米好擔心。兔媽媽話：「遇到困難唔緊要，我哋一齊諗辦法！」佢哋將花盆搬到安全地方。',bubble:'一齊諗辦法！',mom:1,squirrel:0,plant:'🌱',flower:0,rain:1,duration:21000},
{txt:'過咗幾日，小花苗開出一朵靚靚嘅黃色花！米米笑住話：「原來我做得到！」媽媽話：「你最叻係遇到困難都冇放棄！」小朋友，一齊講：「我肯試！我努力！我做得到！」',bubble:'我做得到！',mom:1,squirrel:1,plant:'🪴',flower:1,rain:0,duration:24000}
];let idx=0,playing=false,timer=null,voice=null,started=0,remaining=0;const el=id=>document.getElementById(id);function voices(){return speechSynthesis.getVoices()}function chooseVoice(){const vs=voices();return vs.find(v=>v.lang.toLowerCase()==='zh-hk')||vs.find(v=>/cantonese|hong kong|粵語/i.test(v.name))||null}function cancel(){clearTimeout(timer);timer=null;if('speechSynthesis'in window)speechSynthesis.cancel()}function draw(){let s=scenes[idx];el('sceneNum').textContent=`第${idx+1}幕／共6幕`;el('narration').textContent=s.txt;el('bubble').textContent=s.bubble;el('mom').classList.toggle('hidden',!s.mom);el('squirrel').classList.toggle('hidden',!s.squirrel);el('rain').classList.toggle('hidden',!s.rain);el('sun').classList.toggle('hidden',!!s.rain);el('pot').textContent=s.plant;el('flower').classList.toggle('hidden',!s.flower);el('bar').style.width=(idx/6*100)+'%';el('prev').disabled=idx===0;el('next').disabled=idx===5;el('play').textContent=playing?'⏸ 暫停故事':'▶ 播放故事'}function speak(onEnd){if(!('speechSynthesis'in window)){el('voiceNote').textContent='這個瀏覽器不支援語音朗讀，可閱讀字幕及手動切換。';timer=setTimeout(onEnd,scenes[idx].duration);return}let v=chooseVoice();if(!v)el('voiceNote').textContent='找不到粵語語音，請在裝置安裝香港中文語音；目前只顯示字幕，不會使用普通話代替。';if(!v){timer=setTimeout(onEnd,scenes[idx].duration);return}let u=new SpeechSynthesisUtterance(scenes[idx].txt);u.voice=v;u.lang='zh-HK';u.rate=Number(el('rate').value);u.pitch=1.08;u.onend=()=>{if(playing)onEnd()};u.onerror=()=>{if(playing)timer=setTimeout(onEnd,2500)};speechSynthesis.speak(u)}function advance(){if(!playing)return;if(idx<scenes.length-1){idx++;draw();speak(advance)}else{playing=false;el('bar').style.width='100%';draw();el('bar').style.width='100%';el('voiceNote').textContent='🎉 故事完畢！齊齊講：我肯試！我努力！我做得到！'}}function start(){cancel();playing=true;draw();speak(advance)}function stop(){playing=false;cancel();draw()}el('play').onclick=()=>playing?stop():start();el('next').onclick=()=>{idx=Math.min(5,idx+1);if(playing)start();else{cancel();draw()}};el('prev').onclick=()=>{idx=Math.max(0,idx-1);if(playing)start();else{cancel();draw()}};el('repeat').onclick=()=>{cancel();let was=playing;playing=false;draw();speak(()=>{if(was){playing=true;advance()}})};el('rate').onchange=()=>{if(playing)start()};if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{voice=chooseVoice()};draw();
</script></body></html>
